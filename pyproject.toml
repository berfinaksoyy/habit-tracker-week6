[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (unused imports/variables, undefined names),
# I import order, B bugbear (common bugs), UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# FastAPI's Depends()/Body() defaults are idiomatic
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
